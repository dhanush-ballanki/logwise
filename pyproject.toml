[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logwise"
version = "0.1.0"
description = "Intelligent Log Analyzer CLI Tool"
readme = "README.md"
license = "MIT"
authors = [{ name = "Dhanush Ballanki", email = "dhanushballanki14@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "typer==0.21.1",
]

[project.scripts]
logwise = "logwise.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true